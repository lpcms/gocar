<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Градиент для красивой современной рамки -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF1744" />
    </linearGradient>
    
    <!-- Тень для объема буквы на вкладке -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Фон фавиконки (скругленный квадрат, отлично смотрится в современных браузерах) -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#FFFFFF" stroke="url(#frameGradient)" stroke-width="4" filter="url(#shadow)" />

  <!-- Буква G, стилизованная под образец с картинки -->
  <text x="32" y="45" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="900" 
        font-size="38" 
        fill="#FF334B" 
        text-anchor="middle" 
        letter-spacing="-1">G</text>
</svg>
